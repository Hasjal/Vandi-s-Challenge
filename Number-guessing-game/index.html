<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-container">
      <h1>
        <l>Guess the Number</l>
      </h1>
      <p>I have a number between 1 and 10.<br /><c>Can you guess it?</c></p>
      <input
        type="number"
        id="user-guess"
        placeholder="Enter a number(1-10)"
        min="1" max="10"
      /> <br>
      <p id="empty"></p><br />

      <button id="check-btn">Check</button>

      <div class="message-area" id="guessedNumber">Make your guess!</div>

      <p id="winningNumber"></p>

      <p class="attemps-counter" >Attempts: <span id="count-el" ><b>0</b></span></p>
    </div>
    <script src="script.js"></script>
  </body>
</html>
