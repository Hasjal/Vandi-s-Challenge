<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewpointport"content="width=device-width, initial-scale=1.0">
        <title><b>Number Guessing Game</b></title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="game-container">
        <h1><b><l>Guess the Number</l></b></h1>
        <p>I have a number between 1 and 10.<br><c>Can you guess it?</c></p>
        <input type="number" id="user-guess" placeholder="Enter a number(1-10)"><br><br>
        <button id="check-btn">Check</button>
        <div class="message-area">Make your guess!</div>
        <p class="attemps-counter">Attempts: <span>0</span></p>
        </div>
        

    </body>
</html>
